{{- if not .Values.postgresClustersSecretRef.name -}}
  {{- fail "postgresClustersSecretRef.name is required. Create a secret with clusters.yaml and reference it here." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  # The operator is a cluster-wide singleton: exactly one pod may run at a
  # time. There is no leader election, and every operator pod server-side
  # applies the same child objects under the same field manager. Two pods
  # (e.g. an old and a new version during a rolling update) each re-apply
  # their own rendering of every tenant Deployment, so the Deployments flap
  # between the two specs, pods churn, and the database runs out of
  # connections. Keep replicas fixed at 1 (deliberately not a value), and
  # use Recreate so an upgrade stops the old pod before starting the new
  # one. The cost is a short window with no operator and no admission
  # webhook during an upgrade; see the chart README.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        odoo-operator.bemade.org/release: "{{ .Release.Revision }}"
    spec:
      affinity:
        {{- toYaml .Values.operator.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.operator.tolerations | nindent 8}}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .domain }}
        {{- end }}
      serviceAccountName: odoo-operator
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.operator.image }}
          imagePullPolicy: {{ .Values.operator.imagePullPolicy | default "Always" }}
          args:
            - --postgres-clusters-secret={{ .Values.postgresClustersSecretRef.name }}
            - --default-odoo-image={{ .Values.defaults.odooImage }}
            - --default-storage-class={{ .Values.defaults.storageClass }}
            - --default-storage-size={{ .Values.defaults.storageSize }}
            {{- if .Values.defaults.ingressClass }}
            - --default-ingress-class={{ .Values.defaults.ingressClass }}
            {{- end }}
            {{- if .Values.defaults.ingressIssuer }}
            - --default-ingress-issuer={{ .Values.defaults.ingressIssuer }}
            {{- end }}
            {{- if .Values.defaults.gatewayRefName }}
            - --default-gateway-ref-name={{ .Values.defaults.gatewayRefName }}
            {{- end }}
            {{- if .Values.defaults.gatewayRefNamespace }}
            - --default-gateway-ref-namespace={{ .Values.defaults.gatewayRefNamespace }}
            {{- end }}
            {{- if .Values.defaults.mail.stagingSmtpHost }}
            - --default-staging-smtp-host={{ .Values.defaults.mail.stagingSmtpHost }}
            - --default-staging-smtp-port={{ .Values.defaults.mail.stagingSmtpPort | default 1025 }}
            - --default-staging-smtp-encryption={{ .Values.defaults.mail.stagingSmtpEncryption | default "none" }}
            {{- end }}
            - --job-history-limit={{ .Values.operator.jobHistoryLimit | default 10 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Enables the webhook certificate consistency checker. Without both
            # names the operator leaves the certificates alone rather than
            # guessing at resources it might delete.
            - name: WEBHOOK_CA_SECRET
              value: {{ .Release.Name }}-webhook-ca
            - name: WEBHOOK_CERT_SECRET
              value: {{ .Release.Name }}-webhook-cert
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if not (empty .Values.defaults.resources) }}
            - name: DEFAULT_ODOO_RESOURCES
              value: {{ .Values.defaults.resources | toJson | quote }}
            {{- end }}
            {{- if not (empty .Values.defaults.affinity) }}
            - name: DEFAULT_ODOO_AFFINITY
              value: {{ .Values.defaults.affinity | toJson | quote }}
            {{- end }}
            {{- if not (empty .Values.defaults.tolerations) }}
            - name: DEFAULT_ODOO_TOLERATIONS
              value: {{ .Values.defaults.tolerations | toJson | quote }}
            {{- end }}
          ports:
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ .Release.Name }}-webhook-cert
