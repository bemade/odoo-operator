apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-webhook-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
    - {{ .Release.Name }}-webhook.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ .Release.Name }}-ca-issuer
  secretName: {{ .Release.Name }}-webhook-cert
  # Explicit rather than relying on defaults, so the relationship to the CA's
  # much longer lifetime is visible at a glance.
  duration: 2160h # 90d
  renewBefore: 720h # 30d
